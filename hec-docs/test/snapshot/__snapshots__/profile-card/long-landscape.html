<body class="doc doc--profile-card variant--landscape">
<div class="keepsake keepsake--landscape"  data-capture>
  <div class="keepsake__main" data-qa-fit="profile-card">
    <div class="avatar" data-initials="NH"></div>
    <div class="keepsake__text">
      <h1 class="keepsake__name">Nguyễn Hoàng Phương Quỳnh Trâm Anh</h1>
      <div class="keepsake__bar" aria-hidden="true"></div>
<p class="keepsake__status">"Hôm nay mình đã học được rất nhiều từ mới và mình muốn kể cho cả lớp nghe! I had a wonderful day at school today."</p>      <div class="keepsake__rank">
        <span class="keepsake__title">Supreme Scholar</span>
        <span class="keepsake__lv">LV 12</span>
      </div>
    </div>
  </div>
  <div class="keepsake__stats stat-row">
    <div class="stat-tile">
  <span class="stat-tile__icon" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
  </span>
  <span class="stat-tile__value">18450</span>
  <span class="stat-tile__label">Total XP</span>
</div>

    <div class="stat-tile">
  <span class="stat-tile__icon" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
  </span>
  <span class="stat-tile__value">12</span>
  <span class="stat-tile__label">Level</span>
</div>

    <div class="stat-tile">
  <span class="stat-tile__icon" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 22c4 0 7-2.8 7-7 0-3-1.6-5-3.2-6.8-.6 1.3-1.3 2-2.3 2.3C14 7 12.8 4 10 2 10 6 5 8.4 5 15c0 4.2 3 7 7 7z"/></svg>
  </span>
  <span class="stat-tile__value">134</span>
  <span class="stat-tile__label">Streak</span>
</div>

  </div>
  <div class="keepsake__foot">
    <img class="keepsake__logo" src="/tenant/assets/logo.svg" alt="Happy English Club logo">
    <div class="keepsake__brand">
      <div class="keepsake__wm">Happy English Club ✨</div>
      <div class="keepsake__tag">Learning, an endless journey to perfection</div>
    </div>
  </div>
</div>
