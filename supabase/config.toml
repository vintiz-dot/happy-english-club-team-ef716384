# The assistant. Read-only by construction: all data tools run on the
# CALLER'S JWT (RLS enforced); service role is used only to resolve identity.
[functions.chat]
verify_jwt = true

# Front-desk account recovery, ADMIN side. JWT verified plus an explicit
# admin-role check inside. Refuses outright to touch admin/teacher accounts.
[functions.manage-student-access]
verify_jwt = true

# Front-desk account recovery, FAMILY side. PUBLIC BY NECESSITY — the person
# using it is locked out, so there is no JWT to verify. Hardened instead:
# hashed single-use expiring codes, per-code attempt lock, IP rate limiting,
# uniform error messages, and a hard refusal on staff accounts.
[functions.redeem-access-code]
verify_jwt = false

# The admin sign-in gate. JWT verified at the gateway, then an explicit
# admin-role check inside before any passkey or passcode state is touched.
# Stated here rather than left to the deploy-time default: everything in
# this file is explicit, and this one guards the hashes.
[functions.admin-unlock]
verify_jwt = true

# The audit trail reader. Service role inside, so the JWT check is the
# only thing standing between a signed-in user and every recorded change.
[functions.admin-activity-logs]
verify_jwt = true

# Per-student financial audit for the Reports screen. Service role inside
# (it resolves actor ids to names, which needs auth.users), admin-role
# checked before anything is read. Read-only: it never calls
# calculate-tuition, which would write the invoice it is reporting on.
[functions.student-audit]
verify_jwt = true

# ---------------------------------------------------------------------
# Stated explicitly rather than left to the default.
#
# verify_jwt defaults to true, so none of these were open - but a file
# that lists some functions and not others cannot be read as a policy,
# only as a list of the ones somebody remembered. Four of the entries
# below sit on functions that were running service-role writes with no
# role check at all; the check is now in the function, and the setting
# says so here too.
#
# The five functions above that opt out of JWT verification are
# deliberate and unchanged. Written this way rather than with the literal
# setting so that grepping this file for opted-out functions returns only
# real entries.
# ---------------------------------------------------------------------

