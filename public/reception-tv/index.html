<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>HEC Reception</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Playfair+Display:600,700,800%7CBe+Vietnam+Pro:400,500,600,700&amp;subset=vietnamese">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <header id="top">
      <div class="brand">
        <img src="assets/logo-gold.png" alt="">
        <div>
          <div class="brand-name">Happy English Club</div>
          <div class="brand-sub">Learning, an endless journey to perfection</div>
        </div>
      </div>
      <div id="section-title"></div>
      <div class="clock">
        <div id="clock-time">--:--</div>
        <div id="clock-date"></div>
      </div>
    </header>

    <main id="scenes">
      <section class="scene" id="scene-a"></section>
      <section class="scene" id="scene-b"></section>
    </main>

    <footer id="bottom">
      <img class="pip-badge" src="assets/pip-badge.svg" alt="">
      <div class="ticker-label">HEC</div>
      <div class="ticker"><div id="ticker-track"></div></div>
      <div id="dots"></div>
      <div id="status" title="offline"></div>
    </footer>
    <video id="keepawake" src="assets/keepawake.mp4" muted loop autoplay
      style="position:absolute;right:0;bottom:0;width:2px;height:2px;opacity:0.01"></video>
  </div>

  <!-- Previews only: ?demo=1 loads made-up data. A file, not an inline script, so the site's CSP allows it. -->
  <script src="demo-loader.js"></script>
  <script src="config.js"></script>
  <script src="focus.js"></script>
  <script src="app.js"></script>
</body>
</html>
